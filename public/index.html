<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhập Điểm Học Sinh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-56 bg-blue-900 text-white flex flex-col flex-shrink-0">
    <div class="p-4 border-b border-blue-800">
      <h1 class="text-base font-bold tracking-wide">📚 Nhập Điểm</h1>
      <p class="text-blue-400 text-xs mt-1">Chọn môn học bên dưới</p>
    </div>
    <nav id="mon-list" class="flex-1 overflow-y-auto p-2 space-y-1">
      <p class="text-blue-400 text-xs p-2">Đang tải...</p>
    </nav>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col overflow-hidden">

    <!-- Top bar -->
    <div class="bg-white border-b px-6 py-3 flex items-center justify-between flex-shrink-0 shadow-sm">
      <div>
        <h2 id="mon-title" class="text-base font-semibold text-gray-800">Chọn môn học để bắt đầu</h2>
        <p id="mon-subtitle" class="text-xs text-gray-400 mt-0.5"></p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-quanlynx" onclick="openQuanlyNxModal()"
          class="hidden bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow">
          📝 Nhận xét
        </button>
        <button id="btn-export" onclick="exportData()"
          class="hidden bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow">
          💾 Xuất Excel
        </button>
      </div>
    </div>

    <!-- Table area -->
    <div id="table-container" class="flex-1 overflow-auto p-4">

      <!-- Empty state -->
      <div id="empty-state" class="flex items-center justify-center h-full text-gray-400">
        <div class="text-center">
          <div class="text-6xl mb-4">📊</div>
          <p class="text-lg">Chọn môn học để xem bảng điểm</p>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading-state" class="hidden flex items-center justify-center h-full">
        <div class="text-center text-gray-500">
          <div class="text-4xl mb-3 animate-pulse">⏳</div>
          <p>Đang tải dữ liệu...</p>
        </div>
      </div>

      <!-- Table -->
      <div id="table-wrapper" class="hidden">
        <div class="mb-2 flex items-center gap-3 text-xs text-gray-500">
          <span class="inline-flex items-center gap-1"><span class="w-3 h-3 bg-white border border-gray-300 rounded-sm inline-block"></span> Ô nhập liệu</span>
          <span class="inline-flex items-center gap-1"><span class="w-3 h-3 bg-gray-100 border border-gray-300 rounded-sm inline-block"></span> Chỉ đọc</span>
        </div>
        <!-- Thống kê nhanh -->
        <div id="stats-bar" class="hidden mb-3 flex flex-wrap gap-3"></div>
        <!-- Bộ lọc ẩn/hiện cột -->
        <div id="col-filter" class="mb-3 hidden"></div>
        <div class="overflow-auto rounded-lg shadow">
          <table id="grade-table" class="border-collapse min-w-full bg-white text-sm">
            <colgroup id="table-colgroup"></colgroup>
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Backdrop quản lý nhận xét -->
  <div id="quanlynx-backdrop" class="hidden fixed inset-0 z-40 bg-black/40"></div>

  <!-- Modal quản lý nhận xét -->
  <div id="quanlynx-modal" class="hidden fixed z-50 bg-white rounded-xl shadow-2xl flex flex-col"
       style="width:680px; max-width:95vw; max-height:85vh; top:50%; left:50%; transform:translate(-50%,-50%)">
    <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200 flex-shrink-0">
      <span class="font-semibold text-gray-800">📝 Quản lý nhận xét — <span id="quanlynx-title" class="text-blue-700"></span></span>
      <button onclick="closeQuanlyNxModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>
    <div class="p-4 flex-1 overflow-y-auto">
      <div class="flex items-center gap-2 mb-3 text-xs text-gray-500 font-semibold uppercase tracking-wide">
        <span class="w-24 flex-shrink-0">Mã</span>
        <span class="flex-1">Nội dung nhận xét</span>
        <span class="w-8"></span>
      </div>
      <div id="quanlynx-list" class="space-y-2"></div>
      <button onclick="addNxRow()"
        class="mt-4 px-3 py-1.5 text-sm text-blue-600 border border-blue-300 rounded-lg hover:bg-blue-50 transition-colors">
        + Thêm nhận xét
      </button>
    </div>
    <div class="px-5 py-3 border-t border-gray-200 flex justify-end gap-3 flex-shrink-0">
      <button onclick="closeQuanlyNxModal()"
        class="px-4 py-2 text-sm text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">Huỷ</button>
      <button onclick="saveQuanlyNx()"
        class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700">💾 Lưu</button>
    </div>
  </div>

  <!-- Backdrop quản lý nhận xét -->
  <div id="quanlynx-backdrop" class="hidden fixed inset-0 z-40 bg-black/40"></div>

  <!-- Modal quản lý nhận xét -->
  <div id="quanlynx-modal" class="hidden fixed z-50 bg-white rounded-xl shadow-2xl flex flex-col"
       style="width:680px; max-width:95vw; max-height:85vh; top:50%; left:50%; transform:translate(-50%,-50%)">
    <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200 flex-shrink-0">
      <span class="font-semibold text-gray-800">📝 Quản lý nhận xét — <span id="quanlynx-title" class="text-blue-700"></span></span>
      <button onclick="closeQuanlyNxModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>
    <div class="p-4 flex-1 overflow-y-auto">
      <div class="flex items-center gap-2 mb-3 text-xs text-gray-500 font-semibold uppercase tracking-wide">
        <span class="w-24 flex-shrink-0">Mã</span>
        <span class="flex-1">Nội dung nhận xét</span>
        <span class="w-8"></span>
      </div>
      <div id="quanlynx-list" class="space-y-2"></div>
      <button onclick="addNxRow()"
        class="mt-4 px-3 py-1.5 text-sm text-blue-600 border border-blue-300 rounded-lg hover:bg-blue-50 transition-colors">
        + Thêm nhận xét
      </button>
    </div>
    <div class="px-5 py-3 border-t border-gray-200 flex justify-end gap-3 flex-shrink-0">
      <button onclick="closeQuanlyNxModal()"
        class="px-4 py-2 text-sm text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">Huỷ</button>
      <button onclick="saveQuanlyNx()"
        class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700">💾 Lưu</button>
    </div>
  </div>

  <!-- Backdrop -->
  <div id="nhanxet-backdrop" class="hidden fixed inset-0 z-40 bg-black/30"></div>

  <!-- Popup nhận xét — căn giữa màn hình -->
  <div id="nhanxet-popup" class="hidden fixed z-50 bg-white border border-gray-200 rounded-xl shadow-2xl"
       style="width:580px; max-width:92vw; top:50%; left:50%; transform:translate(-50%,-50%)">
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
      <span class="font-semibold text-gray-700">Chọn nhận xét</span>
      <button onclick="closeNhanxetPopup()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>
    <div class="p-3 border-b border-gray-100">
      <input type="text" id="nhanxet-search" placeholder="🔍 Tìm mã hoặc nội dung..."
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-200"
        oninput="filterNhanxet(this.value)">
    </div>
    <div id="nhanxet-list" class="overflow-y-auto py-1" style="max-height:55vh"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 px-4 py-2.5 rounded-lg shadow-lg text-sm z-50 text-white transition-all"></div>

  <script src="app.js"></script>
</body>
</html>
